spring.application.name=students-manager

spring.datasource.url=jdbc:h2:mem:studentsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console is disabled by default; enable it locally with --spring.profiles.active=dev
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# All endpoints require HTTP Basic auth (see SecurityConfig). Override via env vars in real deployments.
spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:admin123}
